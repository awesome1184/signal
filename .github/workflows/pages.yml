name: Deploy SIGNAL browser preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - ".nvmrc"
      - "package.json"
      - "vite.pages.config.ts"
      - "src/client/**"
      - "src/server/**"
      - "src/shared/**"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run answer-catalog regression tests
        run: npm test
      - name: Typecheck client and server
        run: npm run typecheck
      - name: Build browser preview
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    # Publish the game from this private source repository. The Pages site itself
    # is public; GitHub Free requires a public source repository, while Pro
    # supports Pages deployments from private repositories.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
